name: KNOUX Production Validation

on:
  push:
    branches: [main, codex/production-rescue-rc]
  pull_request:
    branches: [main]

jobs:
  validate:
    name: Security, Quality, and Runtime Gate
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci --include=dev

      - name: Scan tracked production sources for secrets
        run: npm run secret:scan

      - name: Audit production dependencies
        run: npm run audit:production

      - name: Lint production sources
        run: npm run lint

      - name: Run unit and integration tests
        run: npm test

      - name: Build renderer and Electron backend
        run: npm run build

      - name: Run Electron smoke gate
        run: npm run electron:smoke

  windows-installer:
    name: Windows Installer Build Gate
    runs-on: windows-latest
    needs: validate
    if: ${{ needs.validate.result == 'success' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci --include=dev

      - name: Build NSIS installer
        run: npm run dist:installer

      - name: Verify installer artifact
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path release-installer -Filter '*.exe' -File | Select-Object -First 1
          if (-not $installer) { throw 'NSIS installer artifact was not created.' }
          Write-Host "Installer artifact: $($installer.FullName)"

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v4
        with:
          name: knoux-windows-installer
          path: release-installer/**/*
          if-no-files-found: error
